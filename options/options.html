<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiz Answers — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Quiz Answers</h1>
      <p class="sub">Answers are generated with your own OpenAI account.</p>

      <form id="form">
        <label class="field">
          <span class="label">OpenAI API key</span>
          <span class="key-row">
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false"
                   placeholder="sk-…" />
            <button id="reveal" type="button" class="ghost">Show</button>
          </span>
          <span class="hint">
            Create one at
            <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer noopener">platform.openai.com/api-keys</a>.
            It is stored in this browser only and sent to OpenAI, nowhere else.
          </span>
        </label>

        <label class="field">
          <span class="label">Model</span>
          <input id="model" list="models" spellcheck="false" placeholder="gpt-5.6-luna" />
          <datalist id="models"></datalist>
          <span class="hint" id="model-hint">
            The default is a good balance. If answers are wrong, raise <b>Thinking</b>
            before reaching for a pricier model — it is usually the cheaper fix.
          </span>
        </label>

        <label class="field">
          <span class="label">Thinking</span>
          <select id="effort">
            <option value="none">None — fastest and cheapest, but poor at maths</option>
            <option value="low">Low — fine for recall questions</option>
            <option value="medium">Medium — the default, handles calculations</option>
            <option value="high">High — for a paper you keep getting wrong</option>
            <option value="xhigh">Very high — much slower, much dearer</option>
            <option value="max">Maximum — last resort, can time out</option>
          </select>
          <span class="hint">
            How much working the model does before it answers. Going from None to
            Low is the big jump; each step after that costs roughly three times
            the previous one for a smaller gain. Start at Medium and only climb
            if a particular paper keeps coming back wrong.
          </span>
        </label>

        <label class="field">
          <span class="label">Extra instructions <span class="opt">optional</span></span>
          <textarea id="extraInstructions" rows="3"
                    placeholder="e.g. This is for the 2023 NEC. Prefer answers based on that code cycle."></textarea>
          <span class="hint">Added to every request. Useful for naming the syllabus, code edition, or exam board.</span>
        </label>

        <label class="check">
          <input id="showWhy" type="checkbox" />
          <span>Show a one-line reason when I click an answer</span>
        </label>

        <details class="advanced">
          <summary>Advanced</summary>
          <label class="field">
            <span class="label">API base URL</span>
            <input id="baseUrl" spellcheck="false" placeholder="https://api.openai.com/v1" />
            <span class="hint">Change only for an OpenAI-compatible proxy, including a local one such as <code>http://localhost:11434/v1</code>. Saving asks Chrome for access to the new host.</span>
          </label>

          <label class="field">
            <span class="label">Endpoint</span>
            <select id="endpoint">
              <option value="auto">Auto — try /responses, fall back to /chat/completions</option>
              <option value="responses">/responses</option>
              <option value="chat">/chat/completions</option>
            </select>
          </label>
        </details>

        <div class="actions">
          <button id="save" type="submit" class="primary">Save</button>
          <button id="test" type="button" class="ghost">Test key</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
