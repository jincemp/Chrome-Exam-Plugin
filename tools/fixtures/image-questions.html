<!doctype html>
<html><head><title>Image questions fixture</title></head>
<body>
<main>
  <!-- Q1: image-only. A canvas the page draws a circuit diagram onto, no text
       explaining it beyond the number - this is the "question could just be an
       image" case. -->
  <h4>Question 1</h4>
  <canvas id="circuit" width="300" height="200"></canvas>
  <script>
    const ctx = document.getElementById('circuit').getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 300, 200);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.strokeRect(40, 60, 220, 80);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#000000';
    ctx.fillText('R1 = 10 ohm', 60, 100);
  </script>
  <p>a) 1.2 A</p>
  <p>b) 2.4 A</p>
  <p>c) 3.6 A</p>

  <!-- Q2: image + text. A raster diagram (a real PNG, generated below) that
       supplements a text question - the common "here is a graph, answer this"
       case. -->
  <p>2. Referring to the graph below, what is the peak value?</p>
  <img id="graph" width="240" height="160">
  <p>a) 5</p>
  <p>b) 10</p>
  <p>c) 15</p>

  <!-- A tiny decorative icon: must NOT be captured or counted. -->
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" alt="" width="100" height="80">

  <!-- Q3: text-only, no diagram at all - the baseline case, must still work. -->
  <p>3. What is 2 + 2?</p>
  <p>a) 3</p>
  <p>b) 4</p>
  <p>c) 5</p>

  <!-- Q4: an inline SVG diagram. -->
  <p>4. What shape is drawn below?</p>
  <svg width="200" height="150" viewBox="0 0 200 150">
    <rect x="20" y="20" width="160" height="110" fill="none" stroke="black" stroke-width="4" />
    <text x="60" y="80" font-size="18">A rectangle</text>
  </svg>
  <p>a) Circle</p>
  <p>b) Rectangle</p>
  <p>c) Triangle</p>
</main>
<script>
  // Fill the PNG <img> with a tiny generated chart so it is a real captureable
  // raster image rather than a broken link.
  (function () {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 160;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 240, 160);
    ctx.strokeStyle = '#0033ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, 150); ctx.lineTo(60, 40); ctx.lineTo(120, 100); ctx.lineTo(200, 20);
    ctx.stroke();
    document.getElementById('graph').src = c.toDataURL('image/png');
  })();
</script>
</body></html>
